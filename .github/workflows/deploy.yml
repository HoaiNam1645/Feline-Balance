name: CI/CD Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup PHP (chỉ để check basic)
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # (Optional) chạy test nếu có
      # - run: php artisan test

      # Deploy lên server
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          debug: true
          script: |
            echo "Connected successfully"
            whoami
            pwd
            ls
            cd /var/www/Feline-Balance
            git pull origin main

            # Backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            
            # Clear all caches and recreate them correctly
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan cache:clear
            
            # Frontend
            cd frontend
            npm install
            npm run build

            # Check config Nginx (don't break server if Nginx is missing)
            sudo nginx -t && sudo systemctl reload nginx
